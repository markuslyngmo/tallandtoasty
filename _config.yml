title: "tall and toasty"
tagline: "Markus, running a café and a running habit in Oslo"
description: >-
  Markus, in Oslo. I run a café, chase 5K PRs at Bislett Stadion, and write
  about running, food, saunas and life around St. Hanshaugen.
url: "https://tallandtoasty.no"
baseurl: ""
author: Markus
lang: en

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-paginate-v2

feed:
  path: feed.xml

jekyll-archives:
  enabled:
    - tags
  layout: tag-archive
  permalinks:
    tag: '/tags/:name/'

pagination:
  enabled: true
  collection: posts
  per_page: 6
  permalink: '/page/:num/'
  title: ':title - page :num'
  sort_reverse: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
