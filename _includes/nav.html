<header class="site-header">
  <div class="nav-bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">🦒</span> tall and toasty
    </a>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a></li>
      <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} class="active"{% endif %}>Blog</a></li>
    </ul>
    <div class="nav-actions">
      <button class="search-toggle" type="button" aria-label="Search" data-search-open>🔍<span class="search-toggle-hint">/</span></button>
      <button class="sound-toggle" type="button" aria-label="Toggle click sound">🔊</button>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">☀️ Day</button>
    </div>
  </div>
</header>

<div class="search-overlay" id="search-overlay" hidden>
  <div class="search-backdrop" data-search-close></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search">
    <div class="search-input-row">
      <span class="search-input-icon">🔍</span>
      <input type="text" class="search-input" id="search-input" placeholder="Search posts, tags, topics…" autocomplete="off" spellcheck="false">
      <button class="search-close" type="button" aria-label="Close search" data-search-close>✕</button>
    </div>
    <p class="search-hint" id="search-hint">Search through every post on this blog.</p>
    <ul class="search-results" id="search-results"></ul>
  </div>
</div>
